name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_IMAGE: postgres-augurs-extension:package-${{ github.sha }}

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build pinned PostgreSQL toolchain
        run: docker build --target toolchain --tag "${PACKAGE_IMAGE}" .

      - name: Run formatting, tests, and linting
        run: >-
          docker run --rm "${PACKAGE_IMAGE}" sh -euc
          'cargo fmt --check && cargo test --locked && cargo clippy --locked
          --all-targets --all-features -- -D warnings'

  package:
    name: Build PostgreSQL 17 package
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build and validate package
        env:
          IMAGE_NAME: postgres-augurs-extension:package-${{ github.sha }}
          OUTPUT_DIR: "${{ github.workspace }}/dist"
        run: scripts/package.sh

      - name: Upload PostgreSQL package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-augurs-extension-pg17-${{ github.sha }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  package-smoke:
    name: Install package in PostgreSQL 17
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: postgres-augurs-extension-pg17-${{ github.sha }}
          path: dist

      - name: Install and query the package
        run: |
          archive="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "${archive}"
          scripts/package-smoke.sh "${archive}"
